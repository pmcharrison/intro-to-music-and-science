bookdown::bs4_book:
  css: bs4_style.css
  split_bib: yes
  theme:
    primary: "#096B72"
  repo: https://github.com/pmcharrison/intro-to-music-and-science
  includes:
    in_header: [css.html, hypothesis.html]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  # citeproc (rather than natbib) matches the HTML build and tolerates the
  # duplicate/malformed entries that Paperpile exports.
  citation_package: none
  keep_tex: yes
  pandoc_args: ["--lua-filter=latex-images.lua"]
bookdown::epub_book: default
